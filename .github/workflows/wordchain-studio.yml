name: WordChain Studio - EXE and APK

on:
  workflow_dispatch:
  push:
    paths:
      - "wordchain_studio/**"
      - ".github/workflows/wordchain-studio.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wordchain_studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: wordchain_studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Build Windows EXE and NSIS
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WordChain-Studio-Windows
          if-no-files-found: error
          path: |
            wordchain_studio/src-tauri/target/release/wordchain-studio.exe
            wordchain_studio/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wordchain_studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: wordchain_studio/src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck and build
        run: npm run build

      - name: Initialize Android project
        run: npm run tauri -- android init --ci

      - name: Ensure Android INTERNET permission
        run: python3 scripts/ensure_android_internet.py

      - name: Build installable debug APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --target armv7

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WordChain-Studio-Android
          if-no-files-found: error
          path: wordchain_studio/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
