[package]
name = "wordchain-studio"
version = "0.1.0"
description = "Roblox Korean word-chain analysis GUI"
authors = ["gaong5247-cmd"]
edition = "2021"

[lib]
name = "wordchain_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
